<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SyntrianFox Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#10a37f',
            background: '#1e1e2e',
            chatBubbleUser: '#2a2a40',
            chatBubbleAI: '#343457',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-background text-white h-screen flex">

  <!-- Sidebar -->
  <aside
    id="sidebar"
    class="flex flex-col bg-[#202123] w-64 min-w-[16rem] max-w-xs border-r border-gray-700"
  >
    <!-- Logo / Title -->
    <div class="flex items-center justify-between px-4 py-4 border-b border-gray-700">
      <h1 class="text-2xl font-bold text-white select-none">SyntrianFox</h1>
      <!-- Hamburger menu button for mobile -->
      <button
        id="toggle-sidebar"
        class="md:hidden text-gray-400 hover:text-white focus:outline-none"
        aria-label="Toggle sidebar"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>

    <!-- Novo Chat Button -->
    <div class="px-4 py-3 border-b border-gray-700">
      <button
        id="new-chat-btn"
        class="w-full flex items-center justify-start gap-2 px-3 py-2 rounded-md bg-[#343541] hover:bg-[#4a4f69] transition font-semibold text-sm truncate"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        Novo chat
      </button>
    </div>

    <!-- Chat List -->
    <nav id="chat-list" class="flex-1 overflow-y-auto px-2 py-3 space-y-1 scrollbar-thin scrollbar-thumb-gray-700 scrollbar-track-gray-900">
      <!-- chats serão inseridos aqui via JS -->
    </nav>

    <!-- Footer: Dark Mode Toggle -->
    <div class="px-4 py-3 border-t border-gray-700">
      <button
        id="dark-mode-toggle"
        class="w-full flex items-center justify-start gap-2 px-3 py-2 rounded-md bg-[#343541] hover:bg-[#4a4f69] transition font-semibold text-sm truncate"
      >
        <svg
          id="dark-mode-icon"
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m8.66-12.34l-.7.7M4.34 19.66l-.7.7m15.02-7.36h-1M4 12H3m15.66 7.66l-.7-.7M5.34 4.34l-.7-.7M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        Alternar tema
      </button>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col">
    <!-- Header -->
    <header class="p-4 border-b border-gray-700 bg-[#1f1f2f] flex items-center justify-between">
      <h1 class="text-lg font-semibold">Chat com SyntrianFox</h1>
      <button
        id="new-chat-btn-header"
        class="md:hidden flex items-center gap-1 px-3 py-1 rounded bg-primary hover:bg-emerald-600 transition text-sm font-semibold"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        Novo chat
      </button>
    </header>

    <!-- Chat Window -->
    <div id="chat-window" class="flex-1 overflow-y-auto px-4 py-6 space-y-6"></div>

    <!-- Input -->
    <form id="chat-form" class="border-t border-gray-700 p-4 bg-[#1f1f2f] flex gap-3 items-center">
      <input
        id="user-input"
        type="text"
        placeholder="Digite sua mensagem..."
        autocomplete="off"
        class="flex-1 rounded-full bg-gradient-to-r from-[#2c2c4a] to-[#1f1f2f] px-6 py-3 text-white placeholder-gray-400 shadow-input-glow focus:outline-none focus:ring-2 focus:ring-primary transition"
      />
      <button
        type="submit"
        class="bg-primary hover:bg-emerald-600 transition rounded-full p-3 flex items-center justify-center shadow-md shadow-primary/70"
        aria-label="Enviar mensagem"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          class="w-6 h-6 rotate-90"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 10l7-7m0 0l7 7m-7-7v18"
          />
        </svg>
      </button>
    </form>
  </main>

  <script>
    // Sidebar toggle mobile
    const sidebar = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggle-sidebar');
    toggleSidebarBtn.addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-full');
    });

    // Dark mode toggle
    const darkModeToggle = document.getElementById('dark-mode-toggle');
    const darkModeIcon = document.getElementById('dark-mode-icon');
    function isDarkMode() {
      return document.documentElement.classList.contains('dark');
    }
    function setDarkMode(dark) {
      if (dark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    darkModeToggle.addEventListener('click', () => {
      const dark = !isDarkMode();
      setDarkMode(dark);
      // Change icon accordingly (sun/moon)
      if (dark) {
        darkModeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1m0 16v1m8.66-12.34l-.7.7M4.34 19.66l-.7.7m15.02-7.36h-1M4 12H3m15.66 7.66l-.7-.7M5.34 4.34l-.7-.7M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        `;
      } else {
        darkModeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        `;
      }
      // Save preference (optional)
      localStorage.setItem('darkMode', dark);
    });

    // Load saved theme
    const savedDark = localStorage.getItem('darkMode');
    if (savedDark === 'true') {
      setDarkMode(true);
    } else {
      setDarkMode(false);
    }

    // Chat List Logic
    const chatList = document.getElementById('chat-list');
    const newChatBtn = document.getElementById('new-chat-btn');
    const newChatBtnHeader = document.getElementById('new-chat-btn-header');

    let chats = [];
    let currentChatId = null;

    function renderChats() {
      chatList.innerHTML = '';
      chats.forEach((chat, index) => {
        const chatItem = document.createElement('button');
        chatItem.textContent = chat.title || `Chat ${index + 1}`;
        chatItem.className =
          'w-full text-left px-3 py-2 rounded-md hover:bg-gray-600 transition text-sm truncate';
        if (chat.id === currentChatId) {
          chatItem.classList.add('bg-gray-700', 'font-semibold');
        }
        chatItem.addEventListener('click', () => {
          currentChatId = chat.id;
          renderChats();
          loadChat(chat.id);
        });
        chatList.appendChild(chatItem);
      });
    }

    function addNewChat() {
      const id = Date.now().toString();
      chats.push({ id, title: `Chat ${chats.length + 1}`, messages: [] });
      currentChatId = id;
      renderChats();
      loadChat(id);
    }

    function loadChat(id) {
      const chat = chats.find(c => c.id === id);
      if (!chat) return;
      // Limpar e carregar mensagens no chatWindow
      const chatWindow = document.getElementById('chat-window');
      chatWindow.innerHTML = '';
      chat.messages.forEach(msg => {
        appendMessage(msg.content, msg.sender);
      });
    }

    function appendMessage(content, sender = "user") {
      const chatWindow = document.getElementById("chat-window");
      const bubble = document.createElement("div");
      bubble.className = `flex ${sender === "user" ? "justify-end" : "justify-start"}`;
      bubble.innerHTML = `
        <div class="max-w-xl px-4 py-3 rounded-2xl ${
          sender === "user" ? "bg-chatBubbleUser" : "bg-chatBubbleAI"
        }">
          <p>${content}</p>
        </div>
      `;
      chatWindow.appendChild(bubble);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // Enviar mensagem para chat atual
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;
      if (!currentChatId) addNewChat();

      // Salvar mensagem no chat atual
      const chat = chats.find(c => c.id === currentChatId);
      chat.messages.push({ sender: "user", content: message });
      appendMessage(message, "user");
      userInput.value = "";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        chat.messages.push({ sender: "ai", content: data.response });
        appendMessage(data.response, "ai");
      } catch (err) {
        appendMessage("Erro ao enviar mensagem.", "ai");
      }
    });

    // Botões novo chat
    newChatBtn.addEventListener('click', addNewChat);
    newChatBtnHeader.addEventListener('click', addNewChat);

    // Carregar chat inicial
    if (chats.length === 0) {
      addNewChat();
    }
  </script>

</body>
</html>
